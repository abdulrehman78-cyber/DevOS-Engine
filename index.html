<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOS Secure Registry</title>
    <!-- Stable Bootstrap 5 Core Deployment -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .secure-card { background: white; border-radius: 16px; border: 1px solid #e2e8f0; }
        .terminal-log { background-color: #1e1e1e; color: #a6e22e; font-family: 'Courier New', Courier, monospace; border-radius: 8px; }
    </style>
</head>
<body>

    <div class="container py-5">
        <!-- System Access Banner -->
        <div class="row justify-content-center mb-4">
            <div class="col-md-8 text-center">
                <h1 class="fw-bold text-dark">🛡️ DevOS Secure Registry Interface</h1>
                <p class="text-muted">Object-Oriented Cloud Repository Optimization System</p>
            </div>
        </div>

        <div class="row justify-content-center g-4">
            <!-- Left Column: Input Form Control Engine (Option 1) -->
            <div class="col-md-5">
                <div class="secure-card p-4 shadow-sm">
                    <h4 class="fw-bold text-dark mb-3">Register New Repository</h4>
                    <form id="registryForm">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Project Title</label>
                            <input type="text" id="projTitle" class="form-control" placeholder="e.g., noble-finance" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Core Language Stack</label>
                            <input type="text" id="projLang" class="form-control" placeholder="e.g., C++ / JavaScript" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">System Architecture Version</label>
                            <input type="number" step="0.1" id="projVersion" class="form-control" placeholder="e.g., 1.0" required>
                        </div>
                        <button type="submit" class="btn btn-dark w-100 py-2 fw-bold">Commit to Registry</button>
                    </form>
                </div>
            </div>

            <!-- Right Column: Live Memory View Grid (Option 2 & 3) -->
            <div class="col-md-7">
                <div class="secure-card p-4 shadow-sm h-100">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h4 class="fw-bold text-dark m-0">Active System Registries</h4>
                        <span class="badge bg-dark fs-6" id="globalStatsCount">Total Repos: 0</span>
                    </div>
                    
                    <!-- Dynamic Data Injection Targeting Table -->
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>Repository Title</th>
                                    <th>Language</th>
                                    <th>Version</th>
                                    <th class="text-end">Status</th>
                                </tr>
                            </thead>
                            <tbody id="registryTableBody">
                                <!-- JavaScript records will stream natively here -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
